name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - dockerfile: deploy/Dockerfile.api
            image: open-email-api
          - dockerfile: deploy/Dockerfile.ui
            image: open-email-ui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Notify VPS to pull
        if: github.event.repository.default_branch == github.ref_name
        continue-on-error: true
        run: |
          script=dist/notify-vps-pull.py
          if [[ ! -f "$script" ]]; then
            echo "notify-vps: dist/notify-vps-pull.py missing — re-package and commit dist/"
            exit 0
          fi
          python3 "$script" --image "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" --tag main
