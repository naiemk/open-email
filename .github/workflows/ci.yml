name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.svm
            registry/cache
            registry/out
          key: forge-${{ runner.os }}-${{ hashFiles('registry/foundry.toml', 'registry/src/**/*.sol', 'registry/test/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - run: npm ci

      - run: npm run build:ui

      - run: npm run typecheck

      - run: npm run package && git diff --exit-code dist

      - run: npm test
        env:
          RUN_L2_TESTS: ""

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
