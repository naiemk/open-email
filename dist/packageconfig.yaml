name: open-email
version: 1
rawBase: "https://raw.githubusercontent.com/naiemk/open-email/main/dist"
packagerRaw: "https://raw.githubusercontent.com/naiemk/vibed-infra/v0.13.0"
network:
  edge: vps-edge
images:
  backend: "ghcr.io/naiemk/open-email-api:main"
  ui: "ghcr.io/naiemk/open-email-ui:main"
  worker: "busybox:1.36"
  nginx: "nginx:alpine"
autoUpdate:
  lockFile: /var/lock/infra-auto-update.lock
profiles:
  api:
    role: backend
    templates:
      config: api-app.yaml
      envExample: .env.api.example
    startScript: start-api.sh
    updateScript: update-api.sh
    autoUpdate:
      flag: API_AUTO_UPDATE
      intervalEnv: API_AUTO_UPDATE_INTERVAL_MIN
      offset: 0
      stopTimeoutEnv: API_STOP_TIMEOUT
  ui:
    role: ui
    templates:
      envExample: .env.ui.example
    startScript: start-ui.sh
    updateScript: update-ui.sh
    autoUpdate:
      flag: UI_AUTO_UPDATE
      intervalEnv: UI_AUTO_UPDATE_INTERVAL_MIN
      offset: 15
      stopTimeoutEnv: UI_STOP_TIMEOUT
  nodes:
    role: workers
    templates:
      config: nodes-workers.yaml
      envExample: .env.nodes.example
      compose: docker-compose.workers.yml
    startScript: start-nodes.sh
    updateScript: update-nodes.sh
    autoUpdate:
      flag: NODES_AUTO_UPDATE
      intervalEnv: NODES_AUTO_UPDATE_INTERVAL_MIN
      offset: 10
      stopTimeoutEnv: NODES_STOP_TIMEOUT
    workers:
      services:
        - name: worker
          containerName: open-email-worker
          roleEnv: WORKER_ROLE=heartbeat
  gateway:
    role: gateway
    mode: host-extension
    templates:
      envExample: .env.gateway.example
    startScript: start-gateway.sh
    updateScript: update-gateway.sh
    autoUpdate:
      flags:
        - GATEWAY_AUTO_UPDATE
      intervalEnv: GATEWAY_AUTO_UPDATE_INTERVAL_MIN
      offset: 20
      stopTimeoutEnv: GATEWAY_STOP_TIMEOUT
    sites:
      - host: testnet.crypted.email
        backend: open-email-ui
        backendPort: 80
        ui: open-email-ui
        uiPort: 80
        healthPath: /meta
        tlsCertDir: ./certs
        createPath: /signup/invoice
    publicIp: 57.131.150.182
    tlsEmail: "naiemk@gmail.com"
webhook:
  url: "https://testnet.crypted.email/_vibed/hooks/ghcr"
  fallbackUrl: "http://57.131.150.182/_vibed/hooks/ghcr"
  token: 57a10ac9035e054bb77b8bb7ffff2bfa
